<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyScore Configurator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #1a1a1e;
      --surface-2: #222228;
      --text: #f2f2f4;
      --muted: #8b8b96;
      --accent: #f5d000;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 60% 40% at 100% -10%, rgba(245, 208, 0, 0.08), transparent 50%),
        var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(26, 26, 30, 0.92);
    }
    .brand {
      font-family: "Bebas Neue", sans-serif;
      letter-spacing: 0.06em;
      font-size: 1.45rem;
      line-height: 1;
    }
    .brand span { color: var(--accent); }
    .hint { color: var(--muted); font-size: 0.82rem; margin-top: 0.2rem; max-width: 46rem; }
    .actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    button, .ghost {
      font: inherit;
      border: 0;
      border-radius: 999px;
      padding: 0.55rem 1rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #16160a; font-weight: 600; }
    button.primary:disabled { opacity: 0.45; cursor: default; }
    button.stop { background: #3a2024; color: #fecaca; }
    button.small, .ghost {
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
    }
    .side {
      min-height: 0;
      overflow: auto;
      padding: 0.9rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .stage {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      gap: 0.55rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem;
    }
    h2 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.45rem; }
    label strong { color: var(--text); font-weight: 500; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      margin-top: 0.25rem;
      background: #121216;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      font: inherit;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .row { display: flex; gap: 0.45rem; align-items: end; }
    .row > * { flex: 1; }
    .yt {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .yt iframe { width: 100%; height: 100%; border: 0; }
    .yt-results {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 0.45rem;
      max-height: 16rem;
      overflow: auto;
    }
    .yt-results[hidden] { display: none; }
    button.yt-hit {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      width: 100%;
      text-align: left;
      border-radius: 8px;
      padding: 0.35rem;
      background: #121216;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.yt-hit img {
      width: 72px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #000;
    }
    button.yt-hit b {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--text);
    }
    button.yt-hit .yt-meta {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 0.1rem;
    }
    .yt .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1rem;
      text-align: center;
    }
    .bpm {
      font-family: "Bebas Neue", sans-serif;
      font-size: 3.2rem;
      letter-spacing: 0.04em;
      line-height: 0.9;
      color: var(--accent);
    }
    .dots { display: flex; gap: 0.35rem; min-height: 1rem; margin: 0.35rem 0; }
    .dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      background: #2c2c34;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .dot.on { background: var(--accent); box-shadow: 0 0 12px rgba(245, 208, 0, 0.7); }
    .dot.accent.on { background: #fff6b0; }
    .count { font-size: 0.95rem; }
    .count b { color: var(--accent); font-weight: 600; }
    .checks { display: flex; flex-wrap: wrap; gap: 0.55rem 0.8rem; font-size: 0.85rem; }
    .checks label { margin: 0; color: var(--text); display: flex; gap: 0.35rem; align-items: center; }
    label.keep {
      margin: 0.35rem 0 0;
      color: var(--text);
      display: flex;
      gap: 0.4rem;
      align-items: flex-start;
      font-size: 0.85rem;
    }
    .tab-bar { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: end; }
    .tab-bar label { margin: 0; min-width: 7rem; flex: 1; }
    .frame-wrap {
      flex: 1;
      min-height: 240px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #111;
      position: relative;
    }
    #tab-frame { width: 100%; height: 100%; border: 0; background: #111; }
    #tab-frame[hidden] { display: none !important; }
    .status {
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.1rem;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--danger); }
    .source-tools { display: contents; }
    .source-tools[hidden] { display: none !important; }
    input[type="file"] {
      width: 100%;
      margin-top: 0.25rem;
      font: inherit;
      font-size: 0.78rem;
      color: var(--muted);
    }
    button.small.on { outline: 2px solid var(--accent); color: var(--accent); }
    #sheet-view {
      position: absolute;
      inset: 0;
      overflow: auto;
      background: #2a2a2e;
    }
    #sheet-view[hidden] { display: none; }
    .sheet-page { position: relative; margin: 0.6rem; background: #fff; }
    .sheet-page img { display: block; width: 100%; height: auto; user-select: none; }
    .sheet-layer { position: absolute; inset: 0; }
    .sheet-layer.drawing { cursor: crosshair; touch-action: none; }
    .sheet-line {
      position: absolute;
      border: 2px solid rgba(245, 208, 0, 0.9);
      box-sizing: border-box;
      cursor: move;
      touch-action: none;
    }
    #sheet-view.playing .sheet-line,
    #sheet-view.playing .sheet-note { cursor: default; }
    #sheet-view.playing .sheet-handle,
    #sheet-view.playing .sheet-dup,
    #sheet-view.playing .sheet-note-x,
    #sheet-view.playing .sheet-note-bar { display: none; }
    #sheet-view.playing .sheet-note { pointer-events: none; }
    .sheet-note {
      position: absolute;
      z-index: 6;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      border: 2px solid #1c1c20;
      border-radius: 4px;
      background: rgba(255, 250, 220, 0.94);
      color: #16160a;
      font-size: clamp(13px, 1.7cqi, 26px);
      font-weight: 600;
      line-height: 1.2;
      min-height: 2.8em;
      overflow: hidden;
      cursor: move;
      touch-action: none;
    }
    .sheet-page { container-type: inline-size; }
    .sheet-note-bar {
      flex: 0 0 auto;
      height: 0.7em;
      min-height: 10px;
      background: #1c1c20;
      cursor: move;
    }
    .sheet-note textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 0.12em 0.35em 0.2em;
      border: 0;
      resize: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 600;
      line-height: 1.2;
      cursor: text;
    }
    button.sheet-note-x {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 7;
      width: 1.15em;
      height: 0.7em;
      min-height: 10px;
      padding: 0;
      border-radius: 0 2px 0 4px;
      background: #1c1c20;
      color: #f5d000;
      font-size: 0.85em;
      line-height: 1;
    }
    .sheet-dup {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 5;
      transform: translateY(calc(-100% - 2px));
      font: inherit;
      font-size: 0.68rem;
      line-height: 1;
      padding: 0.18rem 0.4rem;
      border: 0;
      border-radius: 6px;
      background: #16160a;
      color: #f5d000;
      cursor: pointer;
    }
    .line-editor {
      position: fixed;
      z-index: 30;
      width: 14rem;
      padding: 0.7rem;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .line-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
    }
    .line-editor label { margin: 0; }
    .sheet-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      margin: -6px;
      background: #1c1c20;
      border: 2px solid #f5d000;
      border-radius: 2px;
      box-sizing: border-box;
      z-index: 4;
    }
    .sheet-handle.n, .sheet-handle.s { left: 50%; cursor: ns-resize; }
    .sheet-handle.e, .sheet-handle.w { top: 50%; cursor: ew-resize; }
    .sheet-handle.n { top: 0; }
    .sheet-handle.s { top: 100%; }
    .sheet-handle.w { left: 0; }
    .sheet-handle.e { left: 100%; }
    .sheet-handle.nw { top: 0; left: 0; cursor: nwse-resize; }
    .sheet-handle.ne { top: 0; left: 100%; cursor: nesw-resize; }
    .sheet-handle.sw { top: 100%; left: 0; cursor: nesw-resize; }
    .sheet-handle.se { top: 100%; left: 100%; cursor: nwse-resize; }
    .sheet-split {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(245, 208, 0, 0.55);
      pointer-events: none;
    }
    #sheet-wash {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(245, 208, 0, 0.22);
      box-shadow: inset 3px 0 0 #f5d000;
      pointer-events: none;
    }
    #sheet-beat {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      margin-left: -1px;
      background: #f5d000;
      box-shadow: 0 0 10px rgba(245, 208, 0, 0.9);
      pointer-events: none;
    }
    .sheet-draft {
      position: absolute;
      border: 2px dashed var(--accent);
      background: rgba(245, 208, 0, 0.12);
      pointer-events: none;
    }
    .sheet-empty {
      color: var(--muted);
      padding: 2rem 1.2rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .line-list { display: flex; flex-direction: column; gap: 0.35rem; max-height: 11rem; overflow: auto; }
    .line-list[hidden] { display: none; }
    .line-page { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; gap: 0.4rem; align-items: center; }
    .line-row { display: flex; gap: 0.4rem; align-items: center; font-size: 0.8rem; }
    .line-row span { flex: 1; }
    .line-row input { width: 4.2rem; margin: 0; }
    @media (max-width: 980px) {
      body { height: auto; }
      main { grid-template-columns: 1fr; }
      .stage { min-height: 80vh; }
      .side { border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand"><span>EasyScore</span> Configurator</div>
      <div class="hint">Video e metronomo. Su un’immagine trascini i righi, li duplichi, li sposti e li allunghi dai quadratini; il cursore segue i beat.</div>
    </div>
    <div class="actions">
      <button class="primary" id="start" type="button">Avvia</button>
      <button class="stop" id="stop" type="button">Stop</button>
    </div>
  </header>
  <main>
    <section class="side">
      <div class="card">
        <h2>Video YouTube</h2>
        <label>Link o ricerca
          <input id="yt-url" type="text" placeholder="Link YouTube, oppure il titolo del brano" autocomplete="off" />
        </label>
        <div class="row">
          <button class="small" id="yt-search" type="button">Cerca</button>
          <button class="small" id="yt-load" type="button">Carica video</button>
        </div>
        <div id="yt-results" class="yt-results" hidden></div>
        <div class="yt" id="yt-box" style="margin-top:0.6rem">
          <div class="empty" id="yt-empty">Nessun video caricato</div>
        </div>
      </div>

      <div class="card">
        <h2>Metronomo</h2>
        <div class="bpm" id="bpm-read">155</div>
        <label>BPM
          <input id="bpm" type="range" min="40" max="220" value="155" />
        </label>
        <div class="row">
          <label>Pulsazioni per battuta
            <input id="per-bar" type="number" min="1" max="12" value="4" />
          </label>
          <label>Battute, poi stop
            <input id="bars" type="number" min="0" max="999" value="16" />
          </label>
        </div>
        <div class="row">
          <label>Precount
            <input id="precount" type="number" min="0" max="32" value="8" />
          </label>
          <label>Parti dalla battuta
            <input id="start-bar" type="number" min="1" max="999" value="1" />
          </label>
        </div>
        <div class="dots" id="dots"></div>
        <div class="count" id="count">In attesa</div>
        <p class="status" id="metro-math"></p>
        <label class="keep">
          <input id="keep-scroll" type="checkbox" checked />
          Allo stop del click la tab continua a seguire le battute
        </label>
      </div>

      <div class="card">
        <h2>Cosa parte con Avvia</h2>
        <div class="checks">
          <label><input id="do-video" type="checkbox" checked /> Video</label>
          <label><input id="do-metro" type="checkbox" checked /> Metronomo</label>
          <label><input id="do-scroll" type="checkbox" checked /> Scorrimento tab</label>
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="tab-bar">
        <label>Sorgente
          <select id="source-mode">
            <option value="songsterr">Songsterr</option>
            <option value="image" selected>Immagini</option>
          </select>
        </label>
        <div id="songsterr-tools" class="source-tools">
          <label style="flex:2; min-width:14rem">Pagina Songsterr
            <input id="tab-url" type="text" value="https://www.songsterr.com/a/wsa/strokes-juicebox-drum-tab-s23717" />
          </label>
          <button class="small" id="tab-load" type="button">Ricarica tab</button>
        </div>
        <div id="image-tools" class="source-tools" hidden>
          <button class="small" id="new-sheet" type="button" title="Toglie immagini e righi e rimette BPM e precount ai valori iniziali">Nuovo</button>
          <label style="min-width:12rem">Immagini dello spartito
            <input id="sheet-file" type="file" accept="image/*" multiple />
          </label>
          <label>Beat nel rigo
            <input id="line-beats" type="number" min="1" max="128" value="8" />
          </label>
          <button class="small" id="draw-line" type="button">Disegna rigo</button>
          <button class="small" id="draw-note" type="button" title="Trascina un riquadro e scrivici dentro. L’appunto resta nel file esportato.">Appunto</button>
          <button class="small" id="clear-lines" type="button">Togli righi</button>
          <button class="small" id="clear-pages" type="button">Togli immagini</button>
          <button class="small" id="export-sheet" type="button">Esporta</button>
          <button class="small" id="import-sheet-btn" type="button">Apri</button>
          <input id="import-sheet" type="file" accept="application/json,.json,.easyscore,.tabsala" hidden />
        </div>
        <button class="small" id="tab-step" type="button">Un passo</button>
        <button class="small" id="tab-reset" type="button">Inizio</button>
      </div>
      <div class="status" id="tab-status">Carico la tab…</div>
      <div id="line-list" class="line-list" hidden></div>
      <div class="frame-wrap" id="stage-frame">
        <iframe
          id="tab-frame"
          title="Tab Songsterr"
          referrerpolicy="no-referrer"
        ></iframe>
        <div id="sheet-view" hidden>
          <div id="sheet-pages"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations()
        .then((regs) => regs.forEach((reg) => reg.unregister()))
        .catch(() => {});
    }

    const $ = (id) => document.getElementById(id);
    const DEFAULT_TAB = 'https://www.songsterr.com/a/wsa/strokes-juicebox-drum-tab-s23717';

    const bpm = $('bpm');
    const perBar = $('per-bar');
    const bars = $('bars');
    const precount = $('precount');
    const startBar = $('start-bar');
    let audioCtx = null;
    let timer = null;
    let nextNote = 0;
    let beatIndex = 0;
    let lastBeatTime = 0;
    let running = false;
    let clicksDone = false;
    let pieceStarted = false;
    let preLeft = 0;
    let preTotal = 0;
    let playFrom = 1;
    let playBeat = 0;
    let shownBeat = -1;
    let stepBar = 1;
    const scheduled = [];

    function num(el, fallback) {
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }
    function beatsPerBar() {
      return Math.max(1, Math.min(12, Math.round(num(perBar, 4))));
    }
    function songBpm() {
      return Math.max(40, Math.min(220, Math.round(num(bpm, 155))));
    }
    function barCount() {
      return Math.max(0, Math.min(999, Math.round(num(bars, 0))));
    }
    function maxBeats() {
      const b = barCount();
      return b === 0 ? 0 : b * beatsPerBar();
    }
    function precountBeats() {
      const raw = precount.value.trim();
      if (raw === '') return 8;
      const n = Math.round(Number(raw));
      if (!Number.isFinite(n)) return 8;
      return Math.max(0, Math.min(32, n));
    }
    function startBarNumber() {
      return Math.max(1, Math.min(999, Math.round(num(startBar, 1)) || 1));
    }
    function songBar(index) {
      return positionAt(index).bar;
    }
    function positionAt(index) {
      const n = beatsPerBar();
      const abs = (playFrom - 1) * n + playBeat + index;
      return { bar: Math.floor(abs / n) + 1, beat: abs % n, abs };
    }
    function updateMath() {
      $('bpm-read').textContent = String(Math.round(num(bpm, 72)));
      const length = barCount();
      const from = startBarNumber();
      const end = length ? from + length - 1 : 0;
      const keep = $('keep-scroll').checked;
      const intro = precountBeats();
      const introText = intro ? ` Prima ${intro} click di precount.` : '';
      const keepText = keep ? ' Poi la tab continua da sola.' : '';
      const span = length
        ? (from > 1
          ? `Dalla battuta ${from} alla ${end}.${keepText}${introText}`
          : `Il click si ferma dopo ${length} battute.${keepText}${introText} Clicca una battuta sullo spartito per partire da lì.`)
        : `Battute a 0: metronomo e tab non si fermano da soli.${from > 1 ? ` Parti dalla battuta ${from}.` : ''}${introText}`;
      $('metro-math').textContent = span;
      paintDots(shownBeat >= 0 ? shownBeat % beatsPerBar() : -1);
    }

    function paintDots(active) {
      const n = beatsPerBar();
      const box = $('dots');
      if (box.childElementCount !== n) {
        box.replaceChildren();
        for (let i = 0; i < n; i++) {
          const d = document.createElement('span');
          d.className = 'dot' + (i === 0 ? ' accent' : '');
          box.appendChild(d);
        }
      }
      [...box.children].forEach((d, i) => d.classList.toggle('on', i === active));
    }

    let sheetPages = [];
    let lineEditor = null;
    let sheetSeq = 1;
    let drawMode = false;
    let noteMode = false;
    let focusNoteId = 0;
    let sheetReady = false;
    let imageStatusKey = '';

    function isImageMode() {
      return $('source-mode').value === 'image';
    }

    function lineBeatCount() {
      return Math.max(1, Math.min(128, Math.round(num($('line-beats'), 8)) || 8));
    }

    function lineBeats(line) {
      if (line.beats) return Math.max(1, Math.min(128, line.beats));
      return Math.max(1, Math.min(128, (line.bars || 1) * beatsPerBar()));
    }

    function highlightBeats(line) {
      const total = lineBeats(line);
      const n = Math.round(Number(line.highlight));
      if (!Number.isFinite(n) || n < 1) return total;
      return Math.max(1, Math.min(total, n));
    }

    function clamp01(n) {
      return Math.max(0, Math.min(1, n));
    }

    const MIN_LINE_W = 0.02;
    const MIN_LINE_H = 0.015;

    function placeLine(box, line) {
      box.style.left = (line.x * 100) + '%';
      box.style.top = (line.y * 100) + '%';
      box.style.width = (line.w * 100) + '%';
      box.style.height = (line.h * 100) + '%';
    }

    function moveLine(start, dx, dy) {
      return {
        x: Math.max(0, Math.min(1 - start.w, start.x + dx)),
        y: Math.max(0, Math.min(1 - start.h, start.y + dy)),
        w: start.w,
        h: start.h,
      };
    }

    function resizeLine(start, dx, dy, edge) {
      let x1 = start.x;
      let y1 = start.y;
      let x2 = start.x + start.w;
      let y2 = start.y + start.h;
      if (edge.includes('w')) x1 = clamp01(start.x + dx);
      if (edge.includes('e')) x2 = clamp01(start.x + start.w + dx);
      if (edge.includes('n')) y1 = clamp01(start.y + dy);
      if (edge.includes('s')) y2 = clamp01(start.y + start.h + dy);
      if (x2 < x1) { const swap = x1; x1 = x2; x2 = swap; }
      if (y2 < y1) { const swap = y1; y1 = y2; y2 = swap; }
      if (x2 - x1 < MIN_LINE_W) {
        if (edge.includes('w')) x1 = Math.max(0, x2 - MIN_LINE_W);
        else x2 = Math.min(1, x1 + MIN_LINE_W);
      }
      if (y2 - y1 < MIN_LINE_H) {
        if (edge.includes('n')) y1 = Math.max(0, y2 - MIN_LINE_H);
        else y2 = Math.min(1, y1 + MIN_LINE_H);
      }
      return { x: x1, y: y1, w: Math.max(MIN_LINE_W, x2 - x1), h: Math.max(MIN_LINE_H, y2 - y1) };
    }

    function barSpans() {
      const spans = [];
      let n = 1;
      sheetPages.forEach((page) => {
        page.lines.forEach((line) => {
          const count = lineBeats(line);
          spans.push({ page, line, start: n, end: n + count - 1 });
          n += count;
        });
      });
      return spans;
    }

    function spanForBeat(beat) {
      return barSpans().find((span) => beat >= span.start && beat <= span.end) || null;
    }

    function openSheetDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('tab-sala', 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains('sheet')) {
            req.result.createObjectStore('sheet', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function persistSheets() {
      if (!sheetReady) return;
      openSheetDb().then((db) => {
        const tx = db.transaction('sheet', 'readwrite');
        tx.objectStore('sheet').put({
          id: 'pages',
          pages: sheetPages.map((page) => ({
            id: page.id,
            name: page.name,
            blob: page.blob,
            lines: page.lines,
            notes: page.notes || [],
          })),
        });
      }).catch(() => {
        setStatus('Le immagini restano in questa sessione: salvataggio locale non riuscito', 'bad');
      });
    }

    function restoreSheets() {
      return openSheetDb().then((db) => new Promise((resolve) => {
        const tx = db.transaction('sheet', 'readonly');
        const req = tx.objectStore('sheet').get('pages');
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      })).then((record) => {
        sheetReady = true;
        if (!record || !record.pages) return;
        record.pages.forEach((page) => {
          if (!page.blob) return;
          const url = URL.createObjectURL(page.blob);
          sheetPages.push({
            id: page.id,
            name: page.name || 'immagine',
            blob: page.blob,
            url,
            lines: Array.isArray(page.lines) ? page.lines : [],
            notes: Array.isArray(page.notes) ? page.notes : [],
          });
          sheetSeq = Math.max(sheetSeq, page.id + 1);
          page.lines.forEach((line) => {
            sheetSeq = Math.max(sheetSeq, line.id + 1);
          });
          (page.notes || []).forEach((note) => {
            sheetSeq = Math.max(sheetSeq, note.id + 1);
          });
        });
        renderSheets();
      }).catch(() => {
        sheetReady = true;
      });
    }

    function sortLines(page) {
      page.lines.sort((a, b) => a.y - b.y || a.x - b.x);
    }

    function pageNotes(page) {
      if (!Array.isArray(page.notes)) page.notes = [];
      return page.notes;
    }

    function sortNotes(page) {
      pageNotes(page).sort((a, b) => a.y - b.y || a.x - b.x);
    }

    function clearSheetMark() {
      $('sheet-wash')?.remove();
      $('sheet-beat')?.remove();
      imageStatusKey = '';
    }

    function renderSheets() {
      const root = $('sheet-pages');
      const hadMark = Boolean($('sheet-wash'));
      root.replaceChildren();
      if (!sheetPages.length) {
        const empty = document.createElement('div');
        empty.className = 'sheet-empty';
        empty.textContent = 'Aggiungi una o più immagini. Premi Disegna rigo per i beat, oppure Appunto per un riquadro di testo.';
        root.appendChild(empty);
      }
      sheetPages.forEach((page) => {
        sortLines(page);
        const wrap = document.createElement('div');
        wrap.className = 'sheet-page';
        wrap.dataset.pageId = String(page.id);
        const img = document.createElement('img');
        img.src = page.url;
        img.alt = page.name;
        img.addEventListener('load', () => {
          if (!running && isImageMode() && $('sheet-wash')) {
            highlightImageBeat((startBarNumber() - 1) * beatsPerBar() + playBeat + 1);
          }
        });
        const layer = document.createElement('div');
        layer.className = 'sheet-layer' + (drawMode || noteMode ? ' drawing' : '');
        page.lines.forEach((line) => {
          const box = document.createElement('div');
          box.className = 'sheet-line';
          box.dataset.lineId = String(line.id);
          box.title = 'Trascina per spostare. Un click apre i valori del rigo e sceglie il beat. I quadratini allungano il rigo.';
          placeLine(box, line);
          const count = lineBeats(line);
          for (let i = 1; i < count; i++) {
            const split = document.createElement('div');
            split.className = 'sheet-split';
            split.style.left = (i / count * 100) + '%';
            box.appendChild(split);
          }
          const dup = document.createElement('button');
          dup.type = 'button';
          dup.className = 'sheet-dup';
          dup.textContent = 'Duplica';
          dup.title = 'Duplica rettangolo';
          dup.addEventListener('click', (ev) => {
            ev.stopPropagation();
            ev.preventDefault();
            duplicateLine(page, line);
          });
          box.appendChild(dup);
          ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach((edge) => {
            const handle = document.createElement('div');
            handle.className = `sheet-handle ${edge}`;
            handle.dataset.edge = edge;
            box.appendChild(handle);
          });
          bindLinePointer(box, line, page);
          layer.appendChild(box);
        });
        pageNotes(page).forEach((note) => layer.appendChild(renderNote(note, page)));
        layer.addEventListener('pointerdown', (ev) => onSheetPointerDown(ev, page, layer));
        wrap.appendChild(img);
        wrap.appendChild(layer);
        root.appendChild(wrap);
      });
      renderLineList();
      if (hadMark && !running) {
        showFollow(startBarNumber(), playBeat, beatsPerBar());
      }
      syncLineEditor();
      if (focusNoteId) {
        const area = document.querySelector(`.sheet-note[data-note-id="${focusNoteId}"] textarea`);
        focusNoteId = 0;
        area?.focus();
      }
    }

    function renderLineList() {
      const list = $('line-list');
      list.replaceChildren();
      if (!isImageMode()) {
        list.hidden = true;
        return;
      }
      list.hidden = false;
      const spans = barSpans();
      sheetPages.forEach((page, pi) => {
        const head = document.createElement('div');
        head.className = 'line-page';
        const title = document.createElement('span');
        title.textContent = `Pagina ${pi + 1} · ${page.name}`;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'small';
        remove.textContent = 'Togli pagina';
        remove.addEventListener('click', () => removeSheetPage(page.id));
        head.append(title, remove);
        list.appendChild(head);
        page.lines.forEach((line, li) => {
          const span = spans.find((item) => item.line === line);
          const row = document.createElement('div');
          row.className = 'line-row';
          const label = document.createElement('span');
          label.textContent = span
            ? `Rigo ${li + 1} · beat ${span.start}–${span.end}`
            : `Rigo ${li + 1}`;
          const beatsInput = document.createElement('input');
          beatsInput.type = 'number';
          beatsInput.min = '1';
          beatsInput.max = '128';
          beatsInput.value = String(lineBeats(line));
          beatsInput.title = 'Beat in questo rigo';
          beatsInput.addEventListener('change', () => setLineBeats(line, beatsInput.value));
          const markName = document.createElement('span');
          markName.textContent = 'evidenzia';
          markName.style.flex = '0 0 auto';
          const markInput = document.createElement('input');
          markInput.type = 'number';
          markInput.min = '1';
          markInput.max = String(lineBeats(line));
          markInput.value = String(highlightBeats(line));
          markInput.title = 'Quanti beat tenere evidenziati insieme';
          markInput.addEventListener('change', () => setLineHighlight(line, markInput.value));
          const dup = document.createElement('button');
          dup.type = 'button';
          dup.className = 'small';
          dup.textContent = 'Duplica';
          dup.addEventListener('click', () => duplicateLine(page, line));
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'small';
          del.textContent = 'Elimina';
          del.addEventListener('click', () => {
            page.lines = page.lines.filter((item) => item !== line);
            persistSheets();
            renderSheets();
          });
          row.append(label, beatsInput, markName, markInput, dup, del);
          list.appendChild(row);
        });
        pageNotes(page).forEach((note, ni) => {
          const row = document.createElement('div');
          row.className = 'line-row';
          row.dataset.noteId = String(note.id);
          const label = document.createElement('span');
          label.textContent = `Appunto ${ni + 1}`;
          const textInput = document.createElement('input');
          textInput.type = 'text';
          textInput.value = note.text || '';
          textInput.placeholder = 'Intro chitarra';
          textInput.maxLength = 400;
          textInput.style.width = 'auto';
          textInput.style.flex = '1';
          textInput.title = 'Testo dell’appunto';
          textInput.addEventListener('input', () => {
            note.text = textInput.value;
            const area = document.querySelector(`.sheet-note[data-note-id="${note.id}"] textarea`);
            if (area && area.value !== note.text) area.value = note.text;
            persistSheets();
          });
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'small';
          del.textContent = 'Elimina';
          del.addEventListener('click', () => removeNote(page, note));
          row.append(label, textInput, del);
          list.appendChild(row);
        });
      });
    }

    function linesOverlap(a, b) {
      return a.x < b.x + b.w - 0.004
        && a.x + a.w > b.x + 0.004
        && a.y < b.y + b.h - 0.004
        && a.y + a.h > b.y + 0.004;
    }

    function duplicateLine(page, line) {
      if (running) return;
      const copy = {
        id: sheetSeq,
        x: line.x,
        y: line.y + line.h,
        w: line.w,
        h: line.h,
        beats: lineBeats(line),
        highlight: highlightBeats(line),
      };
      let guard = 0;
      while (copy.y + copy.h <= 1 && page.lines.some((item) => linesOverlap(copy, item)) && guard < 40) {
        copy.y += copy.h;
        guard += 1;
      }
      if (copy.y + copy.h > 1 || page.lines.some((item) => linesOverlap(copy, item))) {
        const nudge = Math.min(0.03, line.w * 0.15);
        copy.y = Math.max(0, Math.min(1 - line.h, line.y + 0.02));
        copy.x = Math.min(1 - line.w, line.x + nudge);
        if (page.lines.some((item) => linesOverlap(copy, item))) {
          copy.x = Math.max(0, line.x - nudge);
        }
      }
      sheetSeq += 1;
      page.lines.push(copy);
      sortLines(page);
      persistSheets();
      renderSheets();
      const span = barSpans().find((item) => item.line === copy);
      setStatus(span ? `Rettangolo duplicato, beat ${span.start}–${span.end}.` : 'Rettangolo duplicato.', 'ok');
    }

    function setLineBeats(line, raw) {
      line.beats = Math.max(1, Math.min(128, Math.round(Number(raw)) || 1));
      delete line.bars;
      if (line.highlight > line.beats) line.highlight = line.beats;
      persistSheets();
      renderSheets();
    }

    function setLineHighlight(line, raw) {
      line.highlight = Math.max(1, Math.min(lineBeats(line), Math.round(Number(raw)) || 1));
      persistSheets();
      renderSheets();
    }

    function closeLineEditor() {
      $('line-editor')?.remove();
      lineEditor = null;
    }

    function editorTarget() {
      if (!lineEditor) return null;
      const page = sheetPages.find((item) => item.id === lineEditor.pageId);
      const line = page && page.lines.find((item) => item.id === lineEditor.lineId);
      const box = line && document.querySelector(`.sheet-line[data-line-id="${line.id}"]`);
      return page && line && box ? { page, line, box } : null;
    }

    function placeLineEditor(dialog, box) {
      const rect = box.getBoundingClientRect();
      const margin = 8;
      const width = dialog.offsetWidth || 224;
      const height = dialog.offsetHeight || 150;
      let left = rect.left;
      let top = rect.bottom + margin;
      if (left + width > window.innerWidth - margin) left = window.innerWidth - width - margin;
      if (top + height > window.innerHeight - margin) top = rect.top - height - margin;
      left = Math.max(margin, Math.min(left, window.innerWidth - width - margin));
      top = Math.max(margin, Math.min(top, window.innerHeight - height - margin));
      dialog.style.left = left + 'px';
      dialog.style.top = top + 'px';
    }

    function ensureLineEditor() {
      const existing = $('line-editor');
      if (existing) return existing;
      const dialog = document.createElement('div');
      dialog.id = 'line-editor';
      dialog.className = 'line-editor';
      dialog.setAttribute('role', 'dialog');
      dialog.setAttribute('aria-label', 'Modifica rigo');
      const head = document.createElement('div');
      head.className = 'line-editor-head';
      const title = document.createElement('strong');
      title.dataset.role = 'title';
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'small';
      close.textContent = 'Chiudi';
      close.addEventListener('click', closeLineEditor);
      head.append(title, close);
      const beats = document.createElement('input');
      beats.type = 'number';
      beats.min = '1';
      beats.max = '128';
      beats.dataset.field = 'beats';
      beats.addEventListener('change', () => {
        const current = editorTarget();
        if (current) setLineBeats(current.line, beats.value);
      });
      const mark = document.createElement('input');
      mark.type = 'number';
      mark.min = '1';
      mark.dataset.field = 'highlight';
      mark.addEventListener('change', () => {
        const current = editorTarget();
        if (current) setLineHighlight(current.line, mark.value);
      });
      const beatsLabel = document.createElement('label');
      beatsLabel.append('Beat nel rigo', beats);
      const markLabel = document.createElement('label');
      markLabel.append('Evidenzia', mark);
      dialog.append(head, beatsLabel, markLabel);
      document.body.appendChild(dialog);
      return dialog;
    }

    function syncLineEditor() {
      if (!lineEditor) return;
      const current = editorTarget();
      if (!current) {
        closeLineEditor();
        return;
      }
      const dialog = ensureLineEditor();
      const span = barSpans().find((item) => item.line === current.line);
      const index = current.page.lines.indexOf(current.line) + 1;
      dialog.querySelector('[data-role="title"]').textContent = span
        ? `Rigo ${index} · beat ${span.start}–${span.end}`
        : `Rigo ${index}`;
      const beatCount = lineBeats(current.line);
      const beats = dialog.querySelector('[data-field="beats"]');
      const mark = dialog.querySelector('[data-field="highlight"]');
      if (document.activeElement !== beats) beats.value = String(beatCount);
      mark.max = String(beatCount);
      if (document.activeElement !== mark) mark.value = String(highlightBeats(current.line));
      placeLineEditor(dialog, current.box);
    }

    function openLineEditor(page, line) {
      lineEditor = { lineId: line.id, pageId: page.id };
      syncLineEditor();
    }

    function bindLinePointer(box, line, page) {
      box.addEventListener('pointerdown', (ev) => {
        if (running || ev.button !== 0) return;
        if (ev.target.closest?.('.sheet-dup')) return;
        const handle = ev.target.closest?.('.sheet-handle');
        ev.stopPropagation();
        ev.preventDefault();
        const bounds = box.closest('.sheet-page').getBoundingClientRect();
        const start = { x: line.x, y: line.y, w: line.w, h: line.h, cx: ev.clientX, cy: ev.clientY };
        const edge = handle ? handle.dataset.edge : '';
        let dragged = false;
        const move = (event) => {
          const dxPx = event.clientX - start.cx;
          const dyPx = event.clientY - start.cy;
          if (!dragged && Math.hypot(dxPx, dyPx) < 4) return;
          dragged = true;
          const dx = bounds.width ? (event.clientX - start.cx) / bounds.width : 0;
          const dy = bounds.height ? (event.clientY - start.cy) / bounds.height : 0;
          const next = edge ? resizeLine(start, dx, dy, edge) : moveLine(start, dx, dy);
          line.x = next.x;
          line.y = next.y;
          line.w = next.w;
          line.h = next.h;
          placeLine(box, line);
        };
        const up = (event) => {
          box.removeEventListener('pointermove', move);
          box.removeEventListener('pointerup', up);
          box.removeEventListener('pointercancel', up);
          if (!dragged) {
            if (edge) return;
            if (!drawMode) {
              const span = barSpans().find((item) => item.line === line);
              if (span) {
                const rect = box.getBoundingClientRect();
                const t = rect.width ? (event.clientX - rect.left) / rect.width : 0;
                const count = lineBeats(line);
                const index = Math.min(count - 1, Math.max(0, Math.floor(t * count)));
                chooseBeat(span.start + index);
              }
            }
            openLineEditor(page, line);
            return;
          }
          sortLines(page);
          persistSheets();
          renderSheets();
          setStatus(edge ? 'Rigo ridimensionato.' : 'Rigo spostato.', 'ok');
        };
        box.addEventListener('pointermove', move);
        box.addEventListener('pointerup', up);
        box.addEventListener('pointercancel', up);
        box.setPointerCapture(ev.pointerId);
      });
    }

    function removeNote(page, note) {
      page.notes = pageNotes(page).filter((item) => item !== note);
      persistSheets();
      renderSheets();
    }

    function renderNote(note, page) {
      const box = document.createElement('div');
      box.className = 'sheet-note';
      box.dataset.noteId = String(note.id);
      placeLine(box, note);
      const bar = document.createElement('div');
      bar.className = 'sheet-note-bar';
      bar.title = 'Trascina per spostare l’appunto';
      const area = document.createElement('textarea');
      area.value = note.text || '';
      area.placeholder = 'Intro chitarra';
      area.maxLength = 400;
      area.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      area.addEventListener('input', () => {
        note.text = area.value;
        const field = document.querySelector(`.line-row[data-note-id="${note.id}"] input`);
        if (field && field.value !== note.text) field.value = note.text;
        persistSheets();
      });
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'sheet-note-x';
      del.textContent = '×';
      del.title = 'Elimina appunto';
      del.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        ev.preventDefault();
        removeNote(page, note);
      });
      box.append(bar, area, del);
      ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach((edge) => {
        const handle = document.createElement('div');
        handle.className = `sheet-handle ${edge}`;
        handle.dataset.edge = edge;
        box.appendChild(handle);
      });
      bindNotePointer(box, note, page);
      return box;
    }

    function bindNotePointer(box, note, page) {
      box.addEventListener('pointerdown', (ev) => {
        if (running || ev.button !== 0) return;
        if (ev.target.closest?.('textarea, .sheet-note-x')) return;
        const handle = ev.target.closest?.('.sheet-handle');
        ev.stopPropagation();
        ev.preventDefault();
        const bounds = box.closest('.sheet-page').getBoundingClientRect();
        const start = { x: note.x, y: note.y, w: note.w, h: note.h, cx: ev.clientX, cy: ev.clientY };
        const edge = handle ? handle.dataset.edge : '';
        let dragged = false;
        const move = (event) => {
          const dxPx = event.clientX - start.cx;
          const dyPx = event.clientY - start.cy;
          if (!dragged && Math.hypot(dxPx, dyPx) < 4) return;
          dragged = true;
          const dx = bounds.width ? (event.clientX - start.cx) / bounds.width : 0;
          const dy = bounds.height ? (event.clientY - start.cy) / bounds.height : 0;
          const next = edge ? resizeLine(start, dx, dy, edge) : moveLine(start, dx, dy);
          note.x = next.x;
          note.y = next.y;
          note.w = next.w;
          note.h = next.h;
          placeLine(box, note);
        };
        const up = () => {
          box.removeEventListener('pointermove', move);
          box.removeEventListener('pointerup', up);
          box.removeEventListener('pointercancel', up);
          if (!dragged) {
            box.querySelector('textarea')?.focus();
            return;
          }
          sortNotes(page);
          persistSheets();
          renderSheets();
          setStatus(edge ? 'Appunto ridimensionato.' : 'Appunto spostato.', 'ok');
        };
        box.addEventListener('pointermove', move);
        box.addEventListener('pointerup', up);
        box.addEventListener('pointercancel', up);
        box.setPointerCapture(ev.pointerId);
      });
    }

    function onSheetPointerDown(ev, page, layer) {
      const makingNote = noteMode && !drawMode;
      if ((!drawMode && !noteMode) || running || ev.button !== 0 || ev.target !== layer) return;
      const pageEl = layer.parentElement;
      const rect = pageEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      ev.preventDefault();
      const start = {
        x: clamp01((ev.clientX - rect.left) / rect.width),
        y: clamp01((ev.clientY - rect.top) / rect.height),
      };
      const draft = document.createElement('div');
      draft.className = 'sheet-draft';
      layer.appendChild(draft);
      const move = (event) => {
        const x = clamp01((event.clientX - rect.left) / rect.width);
        const y = clamp01((event.clientY - rect.top) / rect.height);
        draft.style.left = (Math.min(start.x, x) * 100) + '%';
        draft.style.top = (Math.min(start.y, y) * 100) + '%';
        draft.style.width = (Math.abs(x - start.x) * 100) + '%';
        draft.style.height = (Math.abs(y - start.y) * 100) + '%';
      };
      const up = (event) => {
        layer.removeEventListener('pointermove', move);
        layer.removeEventListener('pointerup', up);
        draft.remove();
        const x = clamp01((event.clientX - rect.left) / rect.width);
        const y = clamp01((event.clientY - rect.top) / rect.height);
        if (makingNote) {
          let nx = Math.min(start.x, x);
          let ny = Math.min(start.y, y);
          let w = Math.abs(x - start.x);
          let h = Math.abs(y - start.y);
          const pageW = rect.width || 1;
          const pageH = rect.height || 1;
          if (w < 0.04 && h < 0.02) {
            w = Math.min(0.42, 220 / pageW);
            h = Math.min(0.22, 64 / pageH);
          }
          w = Math.max(Math.min(0.5, 160 / pageW), Math.min(1, w));
          h = Math.max(Math.min(0.25, 52 / pageH), Math.min(1, h));
          nx = Math.max(0, Math.min(1 - w, nx));
          ny = Math.max(0, Math.min(1 - h, ny));
          const note = { id: sheetSeq, x: nx, y: ny, w, h, text: '' };
          sheetSeq += 1;
          pageNotes(page).push(note);
          sortNotes(page);
          focusNoteId = note.id;
          persistSheets();
          renderSheets();
          setStatus('Scrivi nel riquadro. L’appunto viene esportato con lo spartito.', 'ok');
          return;
        }
        const line = {
          id: sheetSeq,
          x: Math.min(start.x, x),
          y: Math.min(start.y, y),
          w: Math.abs(x - start.x),
          h: Math.abs(y - start.y),
          beats: lineBeatCount(),
          highlight: lineBeatCount(),
        };
        sheetSeq += 1;
        if (line.w < 0.02 || line.h < 0.015) return;
        page.lines.push(line);
        sortLines(page);
        persistSheets();
        renderSheets();
        const span = barSpans().find((item) => item.line === line);
        if (span) setStatus(`Rigo segnato, beat ${span.start}–${span.end}.`, 'ok');
      };
      layer.addEventListener('pointermove', move);
      layer.addEventListener('pointerup', up);
      layer.setPointerCapture(ev.pointerId);
    }

    function highlightImageBeat(beatNumber) {
      const span = spanForBeat(beatNumber);
      if (!span) {
        clearSheetMark();
        setStatus(`Beat ${beatNumber} fuori dai righi disegnati.`, 'bad');
        return;
      }
      const pageEl = document.querySelector(`.sheet-page[data-page-id="${span.page.id}"]`);
      const lineEl = pageEl?.querySelector(`[data-line-id="${span.line.id}"]`);
      if (!lineEl) return;
      const count = lineBeats(span.line);
      const group = highlightBeats(span.line);
      const index = beatNumber - span.start;
      const origin = Math.floor(index / group) * group;
      const widthBeats = Math.min(group, count - origin);
      const slice = 100 / count;
      let wash = $('sheet-wash');
      let cursor = $('sheet-beat');
      if (!wash) {
        wash = document.createElement('div');
        wash.id = 'sheet-wash';
      }
      if (!cursor) {
        cursor = document.createElement('div');
        cursor.id = 'sheet-beat';
      }
      wash.style.left = (origin * slice) + '%';
      wash.style.width = (widthBeats * slice) + '%';
      cursor.style.left = (index * slice) + '%';
      if (wash.parentElement !== lineEl) lineEl.appendChild(wash);
      if (cursor.parentElement !== lineEl) lineEl.appendChild(cursor);
      const view = $('sheet-view');
      const delta = lineEl.getBoundingClientRect().top - view.getBoundingClientRect().top;
      if (delta < 8 || delta > view.clientHeight * 0.55) view.scrollTop += delta - 16;
      const key = `${beatNumber}:${span.page.id}:${span.line.id}`;
      if (key !== imageStatusKey) {
        imageStatusKey = key;
        const place = sheetPages.indexOf(span.page) + 1;
        const bar = Math.floor((beatNumber - 1) / beatsPerBar()) + 1;
        setStatus(`Beat ${beatNumber} · battuta ${bar} · pagina ${place}`, 'ok');
      }
    }

    function showFollow(bar, beat, beats) {
      if (isImageMode()) highlightImageBeat((bar - 1) * beats + beat + 1);
      else tabMsg({ cmd: 'follow', bar, beat, beats });
    }

    function clearFollow() {
      if (isImageMode()) clearSheetMark();
      else tabMsg({ cmd: 'stop' });
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || '');
          const comma = text.indexOf(',');
          resolve(comma >= 0 ? text.slice(comma + 1) : text);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function exportFileName() {
      const raw = (sheetPages[0] && sheetPages[0].name) || 'spartito';
      const base = raw.replace(/\.[^.]+$/, '').replace(/[^\w\-]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
      return `${base || 'spartito'}.easyscore.json`;
    }

    function exportSheets() {
      if (!sheetPages.length) {
        setStatus('Non c’è uno spartito da esportare.', 'bad');
        return;
      }
      Promise.all(sheetPages.map((page) => blobToBase64(page.blob).then((image) => ({
        name: page.name,
        type: page.blob.type || 'image/png',
        image,
        lines: page.lines.map((line) => ({
          x: line.x,
          y: line.y,
          w: line.w,
          h: line.h,
          beats: lineBeats(line),
          highlight: highlightBeats(line),
        })),
        notes: pageNotes(page).map((note) => ({
          x: note.x,
          y: note.y,
          w: note.w,
          h: note.h,
          text: String(note.text || '').slice(0, 400),
        })),
      })))).then((pages) => {
        const tempo = songBpm();
        const intro = precountBeats();
        const payload = { kind: 'tab-sala', version: 1, bpm: tempo, precount: intro, pages };
        const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        downloadBlob(blob, exportFileName());
        const lines = pages.reduce((sum, page) => sum + page.lines.length, 0);
        const notes = pages.reduce((sum, page) => sum + page.notes.length, 0);
        setStatus(`File esportato: ${pages.length} immagin${pages.length === 1 ? 'e' : 'i'}, ${lines} righ${lines === 1 ? 'o' : 'i'}, ${notes} appunt${notes === 1 ? 'o' : 'i'}, ${tempo} BPM, precount ${intro}.`, 'ok');
      }).catch(() => {
        setStatus('Export non riuscito.', 'bad');
      });
    }

    function pageFromExport(page, index) {
      const raw = String(page && page.image || '').replace(/\s/g, '');
      if (!raw) throw new Error('immagine');
      const type = typeof page.type === 'string' && page.type.startsWith('image/') ? page.type : 'image/png';
      let binary;
      try { binary = atob(raw); } catch { throw new Error('immagine'); }
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      const blob = new Blob([bytes], { type });
      const lines = (Array.isArray(page.lines) ? page.lines : []).map((line) => {
        const x = Number(line.x);
        const y = Number(line.y);
        const w = Number(line.w);
        const h = Number(line.h);
        if (![x, y, w, h].every((n) => Number.isFinite(n))) throw new Error('rigo');
        const beats = Math.max(1, Math.min(128, Math.round(Number(line.beats)) || 8));
        const highlight = Math.max(1, Math.min(beats, Math.round(Number(line.highlight)) || beats));
        const width = Math.max(MIN_LINE_W, Math.min(1, w));
        const height = Math.max(MIN_LINE_H, Math.min(1, h));
        return {
          id: sheetSeq++,
          x: Math.max(0, Math.min(1 - width, x)),
          y: Math.max(0, Math.min(1 - height, y)),
          w: width,
          h: height,
          beats,
          highlight,
        };
      });
      const notes = (Array.isArray(page.notes) ? page.notes : []).map((note) => {
        const x = Number(note.x);
        const y = Number(note.y);
        const w = Number(note.w);
        const h = Number(note.h);
        if (![x, y, w, h].every((n) => Number.isFinite(n))) throw new Error('appunto');
        const width = Math.max(0.04, Math.min(1, w));
        const height = Math.max(0.02, Math.min(1, h));
        return {
          id: sheetSeq++,
          x: Math.max(0, Math.min(1 - width, x)),
          y: Math.max(0, Math.min(1 - height, y)),
          w: width,
          h: height,
          text: String(note.text || '').slice(0, 400),
        };
      });
      return {
        id: sheetSeq++,
        name: String(page.name || `pagina ${index + 1}`).slice(0, 120),
        blob,
        url: URL.createObjectURL(blob),
        lines,
        notes,
      };
    }

    function importSheetText(text) {
      if (running) {
        setStatus('Ferma il metronomo prima di aprire un file.', 'bad');
        return;
      }
      let doc;
      try { doc = JSON.parse(text); } catch { doc = null; }
      if (!doc || doc.kind !== 'tab-sala' || !Array.isArray(doc.pages) || !doc.pages.length) {
        setStatus('Questo file non è uno spartito di EasyScore Configurator.', 'bad');
        return;
      }
      const built = [];
      try {
        doc.pages.forEach((page, index) => built.push(pageFromExport(page, index)));
      } catch {
        built.forEach((page) => URL.revokeObjectURL(page.url));
        setStatus('Il file è incompleto: servono le immagini e i righi.', 'bad');
        return;
      }
      sheetPages.forEach((page) => URL.revokeObjectURL(page.url));
      sheetPages = built;
      clearSheetMark();
      drawMode = false;
      noteMode = false;
      $('draw-line').classList.remove('on');
      $('draw-note').classList.remove('on');
      const tempo = Math.round(Number(doc.bpm));
      if (Number.isFinite(tempo)) bpm.value = String(Math.max(40, Math.min(220, tempo)));
      const intro = Math.round(Number(doc.precount));
      if (Number.isFinite(intro)) precount.value = String(Math.max(0, Math.min(32, intro)));
      sheetReady = true;
      persistSheets();
      renderSheets();
      updateMath();
      const lines = built.reduce((sum, page) => sum + page.lines.length, 0);
      const notes = built.reduce((sum, page) => sum + page.notes.length, 0);
      const tempoText = Number.isFinite(tempo) ? `, ${songBpm()} BPM` : '';
      const introText = Number.isFinite(intro) ? `, precount ${precountBeats()}` : '';
      setStatus(`Spartito aperto: ${built.length} immagin${built.length === 1 ? 'e' : 'i'}, ${lines} righ${lines === 1 ? 'o' : 'i'} e ${notes} appunt${notes === 1 ? 'o' : 'i'}${tempoText}${introText}.`, 'ok');
    }

    function addSheetFiles(files) {
      const list = [...files].filter((file) => file.type.startsWith('image/'));
      if (!list.length) {
        setStatus('Scegli un file immagine.', 'bad');
        return;
      }
      Promise.all(list.map((file) => new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => resolve({ file, url });
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error(file.name));
        };
        img.src = url;
      }))).then((loaded) => {
        let added = 0;
        let replaced = 0;
        loaded.forEach(({ file, url }) => {
          const same = sheetPages.find((page) => page.name === file.name);
          if (same) {
            // Same file name: swap in the new picture and keep the staff boxes.
            URL.revokeObjectURL(same.url);
            same.blob = file;
            same.url = url;
            replaced += 1;
            return;
          }
          sheetPages.push({
            id: sheetSeq,
            name: file.name,
            blob: file,
            url,
            lines: [],
            notes: [],
          });
          sheetSeq += 1;
          added += 1;
        });
        sheetReady = true;
        if (added) {
          drawMode = true;
          noteMode = false;
          $('draw-line').classList.add('on');
          $('draw-note').classList.remove('on');
        }
        persistSheets();
        renderSheets();
        setStatus(added
          ? 'Trascina un rettangolo su ogni rigo. Poi puoi spostarlo o allungarlo dai quadratini.'
          : `Immagin${replaced === 1 ? 'e aggiornata' : 'i aggiornate'}: i righi sono rimasti al loro posto.`, 'ok');
      }).catch(() => {
        setStatus('Una immagine non si è aperta.', 'bad');
      });
    }

    function removeSheetPage(id) {
      const page = sheetPages.find((item) => item.id === id);
      if (page) URL.revokeObjectURL(page.url);
      sheetPages = sheetPages.filter((item) => item.id !== id);
      clearSheetMark();
      persistSheets();
      renderSheets();
    }

    function applySourceMode() {
      const image = isImageMode();
      $('songsterr-tools').hidden = image;
      $('image-tools').hidden = !image;
      $('tab-frame').hidden = image;
      $('sheet-view').hidden = !image;
      $('line-list').hidden = !image;
      if (!image) closeLineEditor();
      try { localStorage.setItem('tab-sala-mode', image ? 'image' : 'songsterr'); } catch { /* ignore */ }
      if (image) {
        renderLineList();
        setStatus(sheetPages.length
          ? 'Immagini pronte. Disegna un rigo oppure clicca una battuta già segnata.'
          : 'Aggiungi le immagini dello spartito.', 'ok');
      }
    }

    function tabMsg(payload) {
      const frame = $('tab-frame');
      if (!frame.contentWindow) return;
      frame.contentWindow.postMessage({ source: 'hrcast-practice', ...payload }, '*');
    }

    function setStatus(text, kind) {
      const el = $('tab-status');
      el.textContent = text;
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function songPath(raw) {
      const value = (raw || '').trim() || DEFAULT_TAB;
      let url;
      try {
        url = new URL(value);
      } catch {
        throw new Error('Indirizzo Songsterr non valido');
      }
      if (!/(^|\.)songsterr\.com$/.test(url.hostname)) {
        throw new Error('Serve un indirizzo di songsterr.com');
      }
      return url.pathname + url.search;
    }

    function hasLocalProxy() {
      return location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    }

    function loadTab() {
      if (!hasLocalProxy()) {
        setStatus('Songsterr si apre solo in locale, con npm start. Qui puoi usare video, metronomo e le immagini dello spartito.', 'bad');
        return;
      }
      let path;
      try {
        path = songPath($('tab-url').value);
      } catch (err) {
        setStatus(err.message, 'bad');
        return;
      }
      setStatus('Carico la tab…');
      $('tab-frame').src = path;
    }

    function youtubeId(raw) {
      const value = raw.trim();
      if (/^[\w-]{11}$/.test(value)) return value;
      let url;
      try { url = new URL(value); } catch { return null; }
      const host = url.hostname.replace(/^www\./, '');
      if (host === 'youtu.be') {
        const id = url.pathname.split('/').filter(Boolean)[0] || '';
        return /^[\w-]{11}$/.test(id) ? id : null;
      }
      if (host === 'youtube.com' || host === 'music.youtube.com' || host === 'm.youtube.com') {
        const v = url.searchParams.get('v');
        if (v && /^[\w-]{11}$/.test(v)) return v;
        const match = url.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
        return match ? match[2] : null;
      }
      return null;
    }

    function loadVideoById(id) {
      $('yt-empty')?.remove();
      let frame = $('yt-player');
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'yt-player';
        frame.allow = 'autoplay; encrypted-media; picture-in-picture';
        frame.allowFullscreen = true;
        frame.title = 'Video YouTube';
        $('yt-box').appendChild(frame);
      }
      frame.src = `https://www.youtube-nocookie.com/embed/${id}?enablejsapi=1&rel=0`;
    }

    function loadVideo() {
      const id = youtubeId($('yt-url').value);
      if (!id) {
        setStatus('Non è un link YouTube: usa Cerca, oppure incolla un indirizzo.', 'bad');
        return;
      }
      $('yt-results').hidden = true;
      loadVideoById(id);
    }

    function renderYoutubeHits(videos) {
      const box = $('yt-results');
      box.replaceChildren();
      if (!videos.length) {
        box.hidden = true;
        setStatus('Nessun video trovato.', 'bad');
        return;
      }
      videos.forEach((video) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'yt-hit';
        const img = document.createElement('img');
        img.alt = '';
        img.src = `https://i.ytimg.com/vi/${encodeURIComponent(video.id)}/mqdefault.jpg`;
        const text = document.createElement('span');
        const title = document.createElement('b');
        title.textContent = video.title || video.id;
        const meta = document.createElement('span');
        meta.className = 'yt-meta';
        meta.textContent = [video.channel, video.length].filter(Boolean).join(' · ');
        text.append(title, meta);
        button.append(img, text);
        button.addEventListener('click', () => {
          $('yt-url').value = `https://www.youtube.com/watch?v=${video.id}`;
          box.hidden = true;
          loadVideoById(video.id);
          setStatus(video.title || 'Video caricato', 'ok');
        });
        box.appendChild(button);
      });
      box.hidden = false;
      setStatus(`${videos.length} video. Scegline uno.`, 'ok');
    }

    function searchYoutube() {
      const q = $('yt-url').value.trim();
      if (youtubeId(q)) {
        loadVideo();
        return;
      }
      if (q.length < 2) {
        setStatus('Scrivi un titolo o incolla un link YouTube.', 'bad');
        return;
      }
      if (!hasLocalProxy()) {
        setStatus('La ricerca YouTube funziona in locale, con npm start.', 'bad');
        return;
      }
      setStatus('Cerco su YouTube…');
      fetch(`/api/youtube-search?q=${encodeURIComponent(q)}`)
        .then((res) => res.json().then((data) => ({ ok: res.ok, data })))
        .then(({ ok, data }) => {
          if (!ok) {
            $('yt-results').hidden = true;
            setStatus(data.error || 'Ricerca non riuscita.', 'bad');
            return;
          }
          renderYoutubeHits(Array.isArray(data.videos) ? data.videos : []);
        })
        .catch(() => {
          $('yt-results').hidden = true;
          setStatus('Ricerca YouTube non riuscita.', 'bad');
        });
    }

    function videoCommand(func) {
      const frame = $('yt-player');
      if (!frame?.contentWindow) return false;
      const send = (payload) => frame.contentWindow.postMessage(JSON.stringify(payload), '*');
      send({ event: 'listening', id: 'yt-player' });
      send({ event: 'command', func, args: [] });
      return true;
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function scheduleClick(time, accent) {
      const ctx = audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(accent ? 1640 : 1080, time);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.2 : 0.11, time + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(time);
      osc.stop(time + 0.06);
    }

    function renderCount(index) {
      const n = beatsPerBar();
      const pos = positionAt(index);
      const beat = pos.beat + 1;
      const bar = pos.bar;
      const length = clicksDone ? 0 : barCount();
      const last = length ? playFrom + length - 1 : 0;
      $('count').innerHTML = last
        ? `Battuta <b>${bar}</b> / ${last} · pulsazione <b>${beat}</b> / ${n}`
        : `Battuta <b>${bar}</b> · pulsazione <b>${beat}</b> / ${n}`;
    }

    function publishBar(index) {
      if (!$('do-scroll').checked) return;
      const pos = positionAt(index);
      showFollow(pos.bar, pos.beat, beatsPerBar());
    }

    function chooseBeat(beatNumber) {
      const n = beatsPerBar();
      const beat = (beatNumber - 1) % n;
      const bar = Math.floor((beatNumber - 1) / n) + 1;
      chooseStart(bar, beat);
    }

    function chooseStart(bar, beatInBar = 0) {
      const nBar = Math.max(1, Math.min(999, Math.round(Number(bar)) || 1));
      const nBeat = Math.max(0, Math.min(beatsPerBar() - 1, Math.round(beatInBar) || 0));
      playBeat = nBeat;
      if (startBar.value !== String(nBar)) startBar.value = String(nBar);
      stepBar = nBar;
      updateMath();
      if (running) return;
      showFollow(nBar, playBeat, beatsPerBar());
      const beatNo = (nBar - 1) * beatsPerBar() + playBeat + 1;
      $('count').innerHTML = nBar > 1 || playBeat > 0
        ? `Partenza dal beat <b>${beatNo}</b> · battuta <b>${nBar}</b>`
        : 'In attesa';
      paintDots(nBar > 1 || playBeat > 0 ? playBeat : -1);
    }

    function beginPiece() {
      if (pieceStarted) return;
      pieceStarted = true;
      if ($('do-video').checked) {
        if (!videoCommand('playVideo')) {
          setStatus('Video non caricato: incolla un indirizzo YouTube e premi Carica video');
        }
      }
    }

    function onPre(index, total) {
      paintDots(index % beatsPerBar());
      $('count').innerHTML = `Precount <b>${index + 1}</b> / ${total}`;
    }

    function onBeat(index) {
      beginPiece();
      shownBeat = index;
      paintDots(index % beatsPerBar());
      renderCount(index);
      publishBar(index);
    }

    function scheduler() {
      if (!running) return;
      const wantScroll = $('do-scroll').checked;
      const wantClick = $('do-metro').checked && !clicksDone;
      if (!wantClick && !wantScroll && preLeft <= 0 && pieceStarted) return;
      const ctx = audioCtx;
      const bpmNow = Math.max(30, Math.min(280, num(bpm, 155)));
      const spacing = 60 / bpmNow;
      const limit = maxBeats();
      const per = beatsPerBar();
      while (nextNote < ctx.currentTime + 0.12) {
        if (preLeft > 0) {
          const preIndex = preTotal - preLeft;
          scheduleClick(nextNote, preIndex % per === 0);
          scheduled.push({ time: nextNote, pre: true, preIndex });
          preLeft -= 1;
          lastBeatTime = nextNote;
          nextNote += spacing;
          continue;
        }
        if (!wantClick && !wantScroll) {
          if (!pieceStarted && beatIndex === 0) {
            scheduled.push({ time: nextNote, index: 0 });
            beatIndex = 1;
            lastBeatTime = nextNote;
            nextNote += spacing;
          }
          return;
        }
        if (!clicksDone && limit && beatIndex >= limit) {
          clicksDone = true;
          if (!$('keep-scroll').checked || !$('do-scroll').checked) {
            if (ctx.currentTime >= lastBeatTime + 0.06) stopAll('Battute finite');
            return;
          }
          $('count').textContent = 'Click fermo, la tab continua';
          setStatus('Il click si è fermato. La tab segue ancora le battute, finché premi Stop.', 'ok');
        }
        const accent = beatIndex % per === 0;
        if (!clicksDone && $('do-metro').checked) scheduleClick(nextNote, accent);
        scheduled.push({ time: nextNote, index: beatIndex });
        lastBeatTime = nextNote;
        nextNote += spacing;
        beatIndex += 1;
      }
    }

    function followBeats() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      while (scheduled.length && scheduled[0].time <= now + 0.02) {
        const item = scheduled.shift();
        if (item.pre) onPre(item.preIndex, preTotal);
        else onBeat(item.index);
      }
    }

    function startAll() {
      if (running) return;
      const wantMetro = $('do-metro').checked;
      const wantScroll = $('do-scroll').checked;
      const wantVideo = $('do-video').checked;
      const countIn = precountBeats();
      if (!wantMetro && !wantScroll && !wantVideo) return;
      running = true;
      closeLineEditor();
      $('sheet-view').classList.add('playing');
      clicksDone = false;
      pieceStarted = false;
      preTotal = countIn;
      preLeft = countIn;
      playFrom = startBarNumber();
      shownBeat = -1;
      beatIndex = 0;
      stepBar = playFrom;
      scheduled.length = 0;
      $('count').innerHTML = countIn ? `Precount <b>0</b> / ${countIn}` : 'Via';
      paintDots(-1);
      $('start').disabled = true;

      if (wantMetro || wantScroll || countIn > 0) {
        const ctx = ensureAudio();
        nextNote = ctx.currentTime + 0.06;
        lastBeatTime = nextNote;
        scheduler();
        timer = setInterval(() => {
          scheduler();
          followBeats();
        }, 25);
        if (countIn > 0) {
          setStatus(`Precount di ${countIn} click, poi parte lo spartito.`, 'ok');
        }
      } else if (wantVideo) {
        beginPiece();
      }
    }

    function stopAll(reason) {
      running = false;
      $('sheet-view').classList.remove('playing');
      clicksDone = false;
      pieceStarted = false;
      preLeft = 0;
      if (timer) clearInterval(timer);
      timer = null;
      scheduled.length = 0;
      $('start').disabled = false;
      videoCommand('pauseVideo');
      if (reason) $('count').textContent = reason;
      else if (shownBeat < 0) $('count').textContent = 'Fermo';
      // Playback already painted this beat. Leave the mark and the scroll there.
      if (shownBeat >= 0 && reason !== 'Inizio') return;
      clearFollow();
      if (reason !== 'Inizio' && (isImageMode() ? spanForBeat((startBarNumber() - 1) * beatsPerBar() + playBeat + 1) : startBarNumber() > 1)) {
        showFollow(startBarNumber(), playBeat, beatsPerBar());
      }
    }

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || data.source !== 'hrcast-tab' || isImageMode()) return;
      window.__tabDebug = data;
      if (data.boot) setStatus('Clicca una battuta sullo spartito per scegliere da dove partire.', 'ok');
      if (data.pick && !running) chooseStart(data.pick);
      if (data.follow) {
        const where = (data.measures || []).join('–');
        setStatus(
          data.exact
            ? `Battuta ${data.bar} · riga ${where || data.bar}`
            : `Cerco la battuta ${data.bar}…`,
          'ok'
        );
      }
      if (data.error) setStatus(data.error, 'bad');
    });

    $('start').addEventListener('click', startAll);
    $('stop').addEventListener('click', () => stopAll('Fermo'));
    $('yt-load').addEventListener('click', loadVideo);
    $('yt-search').addEventListener('click', searchYoutube);
    $('yt-url').addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter') return;
      if (youtubeId($('yt-url').value)) loadVideo();
      else searchYoutube();
    });
    $('tab-load').addEventListener('click', loadTab);
    $('tab-url').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') loadTab();
    });
    $('tab-step').addEventListener('click', () => {
      if (running) return;
      chooseStart(startBarNumber() + 1);
    });
    $('tab-reset').addEventListener('click', () => {
      stepBar = 1;
      playFrom = 1;
      playBeat = 0;
      startBar.value = '1';
      if (running) stopAll('Inizio');
      if (isImageMode()) {
        clearSheetMark();
        $('sheet-view').scrollTop = 0;
      } else {
        tabMsg({ cmd: 'reset' });
      }
      shownBeat = -1;
      paintDots(-1);
      updateMath();
      if (!running) $('count').textContent = 'In attesa';
    });
    $('tab-frame').addEventListener('load', () => {
      tabMsg({ cmd: 'ping' });
      setTimeout(() => tabMsg({ cmd: 'ping' }), 1500);
      setTimeout(() => tabMsg({ cmd: 'ping' }), 4000);
    });

    $('keep-scroll').addEventListener('change', updateMath);
    $('do-scroll').addEventListener('change', () => {
      if (!$('do-scroll').checked) clearFollow();
      else if (running && shownBeat >= 0) publishBar(shownBeat);
    });
    [bpm, perBar, bars, precount].forEach((el) => el.addEventListener('input', updateMath));
    startBar.addEventListener('input', () => {
      if (running) return;
      chooseStart(startBarNumber());
    });
    $('source-mode').addEventListener('change', () => {
      applySourceMode();
      if (!isImageMode() && !$('tab-frame').getAttribute('src')) loadTab();
    });
    document.addEventListener('pointerdown', (ev) => {
      const dialog = $('line-editor');
      if (!dialog || dialog.contains(ev.target)) return;
      const lineId = ev.target.closest?.('.sheet-line')?.dataset.lineId;
      if (lineId && lineEditor && String(lineEditor.lineId) === lineId) return;
      closeLineEditor();
    });
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeLineEditor();
    });
    $('sheet-view').addEventListener('scroll', () => {
      const current = editorTarget();
      const dialog = $('line-editor');
      if (current && dialog) placeLineEditor(dialog, current.box);
    });
    $('sheet-file').addEventListener('change', () => {
      addSheetFiles($('sheet-file').files);
      $('sheet-file').value = '';
    });
    $('draw-line').addEventListener('click', () => {
      drawMode = !drawMode;
      if (drawMode) noteMode = false;
      $('draw-line').classList.toggle('on', drawMode);
      $('draw-note').classList.toggle('on', noteMode);
      renderSheets();
    });
    $('draw-note').addEventListener('click', () => {
      noteMode = !noteMode;
      if (noteMode) drawMode = false;
      $('draw-note').classList.toggle('on', noteMode);
      $('draw-line').classList.toggle('on', drawMode);
      renderSheets();
    });
    $('clear-lines').addEventListener('click', () => {
      sheetPages.forEach((page) => { page.lines = []; });
      clearSheetMark();
      persistSheets();
      renderSheets();
    });
    $('clear-pages').addEventListener('click', () => {
      sheetPages.forEach((page) => URL.revokeObjectURL(page.url));
      sheetPages = [];
      clearSheetMark();
      persistSheets();
      renderSheets();
      setStatus('Immagini tolte.', 'ok');
    });
    $('new-sheet').addEventListener('click', () => {
      const hasWork = sheetPages.length > 0;
      if (hasWork && !confirm('Ripartire da zero? Immagini, righi e appunti verranno tolti. Esporta prima se vuoi tenerli.')) return;
      if (running) stopAll('Fermo');
      closeLineEditor();
      sheetPages.forEach((page) => URL.revokeObjectURL(page.url));
      sheetPages = [];
      clearSheetMark();
      drawMode = false;
      noteMode = false;
      $('draw-line').classList.remove('on');
      $('draw-note').classList.remove('on');
      [bpm, precount, $('line-beats')].forEach((input) => { input.value = input.defaultValue; });
      stepBar = 1;
      playFrom = 1;
      playBeat = 0;
      startBar.value = '1';
      shownBeat = -1;
      paintDots(-1);
      $('count').textContent = 'In attesa';
      $('sheet-view').scrollTop = 0;
      sheetReady = true;
      persistSheets();
      renderSheets();
      updateMath();
      setStatus('Nuovo spartito: aggiungi le immagini.', 'ok');
    });
    $('export-sheet').addEventListener('click', exportSheets);
    $('import-sheet-btn').addEventListener('click', () => $('import-sheet').click());
    $('import-sheet').addEventListener('change', () => {
      const file = $('import-sheet').files && $('import-sheet').files[0];
      $('import-sheet').value = '';
      if (!file) return;
      file.text().then(importSheetText).catch(() => {
        setStatus('Il file non si è aperto.', 'bad');
      });
    });

    updateMath();
    $('source-mode').value = 'image';
    applySourceMode();
    restoreSheets().then(applySourceMode);
  </script>
</body>
</html>
